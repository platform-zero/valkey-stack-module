---
schemaVersion: 1
module: "valkey"
target: "core"
services:
  valkey:
    image: "valkey/valkey:8.1.5"
    containerName: "valkey"
    lifecycle: "daemon"
    updatePolicy: "registry"
    placement: "rootful"
    environment:
      VALKEY_PASSWORD: "${VALKEY_ADMIN_PASSWORD}"
      VALKEY_SEAFILE_PASSWORD: "${VALKEY_SEAFILE_PASSWORD}"
      VALKEY_MASTODON_PASSWORD: "${VALKEY_MASTODON_PASSWORD}"
    networks:
    - "valkey"
    volumes:
    - "redis_data:/data"
    - "valkey_acl:/etc/valkey"
    health:
      test:
      - "CMD-SHELL"
      - |
        export REDISCLI_AUTH="$${VALKEY_PASSWORD}"
        valkey-cli --user default ping >/dev/null &&
        valkey-cli --user default --raw INFO persistence | awk -F: '$$1=="loading"{gsub(/\r/, "", $$2); found=1; ready=($$2=="0")} END{exit (found && ready) ? 0 : 1}' &&
        valkey-cli --user default SET healthcheck:test "$${RANDOM}" EX 5 >/dev/null &&
        valkey-cli --user default GET healthcheck:test >/dev/null &&
        valkey-cli --user default INFO replication | grep -q role:master
      interval: "5s"
      timeout: "5s"
      retries: 24
      start_period: "15s"
    entrypoint:
    - "/bin/sh"
    - "-c"
    - |
      set -e
      umask 077
      mkdir -p /etc/valkey
      if [ -L /etc/valkey/users.acl ] || { [ -e /etc/valkey/users.acl ] && [ ! -f /etc/valkey/users.acl ]; }; then
        echo 'Refusing unrelated Valkey ACL path' >&2
        exit 1
      fi
      # Existing authored/native ACL users and credentials are not startup scratch.
      if [ ! -e /etc/valkey/users.acl ]; then
        cat > /etc/valkey/users.acl <<EOF
      user default on >$${VALKEY_PASSWORD} ~* &* +@all
      user seafile on >$${VALKEY_SEAFILE_PASSWORD} ~* &* +@all
      user mastodon on >$${VALKEY_MASTODON_PASSWORD} ~* &* +@all
      EOF
      fi
      chmod 0600 /etc/valkey/users.acl
      exec valkey-server --appendonly yes --dir /data --databases 16 --aclfile /etc/valkey/users.acl
    restart: "unless-stopped"
networks: {}
volumes:
  valkey_acl:
    hostPath: "${STACK_VOLUME_ROOT}/valkey_acl"
